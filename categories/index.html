<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Configure Outgo transaction categories.">
    <title>Categories · Outgo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <form action="/"><button type="submit">Overview</button></form>
      <form action="/ledger/"><button type="submit">Ledger</button></form>
      <form action="/analysis/"><button type="submit">Analysis</button></form>
    </nav>

    <main>
      <section aria-labelledby="page-heading">
        <h2 id="page-heading">Categories</h2>
        <form id="new-category">
          <label for="new-category-name">New category</label><br>
          <input id="new-category-name" name="name" autocomplete="off" required>
          <button type="submit">Add</button>
        </form>
        <p id="category-status" role="status"></p>
        <p id="empty-state" hidden>No categories yet.</p>
        <ul id="active-categories"></ul>
      </section>

      <section id="archived-section" aria-labelledby="archived-heading" hidden>
        <h2 id="archived-heading">Archived</h2>
        <p>Archived categories are hidden on the Add page but stay on past transactions.</p>
        <ul id="archived-categories"></ul>
      </section>
    </main>

    <noscript>This application needs JavaScript for offline storage and sync.</noscript>
    <script type="module" src="/js/pages/categories.js"></script>
  </body>
</html>
