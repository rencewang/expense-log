<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6">
    <meta name="description" content="A small expense tracker.">
    <title>Overview · Outgo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <form action="/"><button type="submit" aria-current="page" disabled>Overview</button></form>
      <form action="/transactions/"><button type="submit">Ledger</button></form>
      <form action="/add/"><button type="submit">Add</button></form>
      <form action="/analytics/"><button type="submit">Analysis</button></form>
    </nav>

    <main>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">This month</h2>
        <p>
          <strong id="month-spent">$0.00</strong> spent ·
          <strong id="month-credits">$0.00</strong> credited ·
          <strong id="month-net">$0.00</strong> net outflow across
          <span id="month-count">0</span> transactions.
        </p>
        <table>
          <thead>
            <tr><th>Category</th><th>Amount</th></tr>
          </thead>
          <tbody id="category-summary"></tbody>
        </table>
      </section>

      <section aria-labelledby="sync-heading">
        <h2 id="sync-heading">Sync</h2>
        <p><label for="app-password">App password</label><br>
          <input id="app-password" type="password" autocomplete="current-password">
        </p>
        <p><label><input id="remember-password" type="checkbox" checked> Remember on this device</label></p>
        <button id="sync-button" type="button">Sync now</button>
        <p id="sync-status" role="status">Not synced this session.</p>
      </section>
    </main>

    <noscript>This application needs JavaScript for offline storage and sync.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
