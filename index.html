<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A small expense tracker.">
    <title>Overview · Outgo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <form action="/"><button type="submit" aria-current="page" disabled>Overview</button></form>
      <form action="/ledger/"><button type="submit">Ledger</button></form>
      <form action="/analysis/"><button type="submit">Analysis</button></form>
    </nav>

    <main>
      <section aria-labelledby="month-heading">
        <h2 id="month-heading">This month</h2>
        <p>
          <a id="previous-month" href="/">Previous month</a>
          <span id="next-month-separator"> · </span>
          <a id="next-month" href="/">Next month</a>
        </p>
        <p>
          <strong id="month-spent">$0.00</strong> spent ·
          <strong id="month-credits">$0.00</strong> credited ·
          <strong id="month-net">$0.00</strong> net outflow across
          <span id="month-count">0</span> transactions.
        </p>

        <div id="day-bars" class="day-bars" role="group" aria-label="Spending by day"></div>

        <p role="group" aria-label="Show transactions for">
          <button id="month-tab" type="button" aria-pressed="false" aria-controls="month-panel">Month</button>
          <button id="day-tab" type="button" aria-pressed="false" aria-controls="day-panel">Day</button>
        </p>

        <div id="day-panel" hidden>
          <h3>
            <button id="previous-day" type="button" aria-label="Previous day">←</button>
            <span id="day-heading"></span>
            <button id="next-day" type="button" aria-label="Next day">→</button>
            <button type="submit" form="add-for-day">Add</button>
          </h3>
          <form id="add-for-day" action="/add/" hidden>
            <input id="add-date" name="date" type="hidden">
          </form>
          <p id="day-empty" hidden>No transactions on this day.</p>
          <table id="day-table" hidden>
            <thead>
              <tr><th>Merchant</th><th>Category</th><th>Debit</th><th>Credit</th><th></th></tr>
            </thead>
            <tbody id="day-records"></tbody>
          </table>
        </div>

        <div id="month-panel" hidden>
          <p id="month-empty" hidden>No transactions this month.</p>
          <div id="month-categories"></div>
        </div>
      </section>

      <section aria-labelledby="sync-heading">
        <h2 id="sync-heading">Sync</h2>
        <button id="sync-button" type="button">Sync now</button>
        <p id="sync-status" role="status">Not synced this session.</p>
      </section>
    </main>

    <noscript>This application needs JavaScript for offline storage and sync.</noscript>
    <script type="module" src="/js/pages/overview.js"></script>
  </body>
</html>
