<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6">
    <meta name="description" content="Record an Outgo expense or credit.">
    <title>Add transaction · Outgo</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <form action="/"><button type="submit">Overview</button></form>
      <form action="/transactions/"><button type="submit">Ledger</button></form>
      <form action="/add/"><button type="submit" aria-current="page" disabled>Add</button></form>
      <form action="/analytics/"><button type="submit">Analysis</button></form>
    </nav>

    <main>
      <section aria-labelledby="page-heading">
        <h2 id="page-heading">Add transaction</h2>
        <form id="expense-form">
          <fieldset>
            <legend>Type</legend>
            <label><input name="type" type="radio" value="expense" checked> Expense</label>
            <label><input name="type" type="radio" value="credit"> Credit</label>
          </fieldset>
          <p>
            <label for="amount">Amount</label><br>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required>
          </p>
          <p>
            <label for="date">Date</label><br>
            <input id="date" name="date" type="date" required>
          </p>
          <p>
            <label for="category">Category</label><br>
            <input id="category" name="category" list="categories" autocomplete="off" required>
            <datalist id="categories">
              <option value="food"></option>
              <option value="transport"></option>
              <option value="shopping"></option>
              <option value="bills"></option>
              <option value="travel"></option>
              <option value="other"></option>
            </datalist>
          </p>
          <p>
            <label for="merchant">Merchant</label><br>
            <input id="merchant" name="merchant" autocomplete="off">
          </p>
          <p>
            <label for="note">Note</label><br>
            <input id="note" name="note" autocomplete="off">
          </p>
          <button type="submit">Record transaction</button>
          <p id="entry-status" role="status"></p>
        </form>
      </section>
    </main>

    <noscript>This application needs JavaScript for offline storage and sync.</noscript>
    <script type="module" src="/js/pages/add.js"></script>
  </body>
</html>
